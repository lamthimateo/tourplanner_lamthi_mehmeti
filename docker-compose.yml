services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tourplanner
      POSTGRES_USER: tourplanner
      POSTGRES_PASSWORD: tourplanner
    ports:
      - "5432:5432"
    volumes:
      - tourplanner-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tourplanner-db-data:
