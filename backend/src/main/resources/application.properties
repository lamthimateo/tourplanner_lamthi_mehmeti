# Backend (Spring Boot) configuration
server.port=${SERVER_PORT:8081}

# --- File storage ---
# Root directory for images, reports, and logs. Override with APP_BASE_DIR.
app.base-dir=${APP_BASE_DIR:${user.home}/TourPlanner}

# --- Database ---
# PostgreSQL is the default runtime database.
# You can override via backend/.env (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tourplanner}
spring.datasource.username=${DB_USERNAME:tourplanner}
spring.datasource.password=${DB_PASSWORD:tourplanner}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate 6 auto-detects the dialect from the JDBC URL.

# --- Uploads ---
# Tour images are photos; Spring's 1 MB default would reject most of them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- OpenRouteService API key (set ORS_API_KEY in .env) ---
openrouteservice.api.key=${ORS_API_KEY:}

# --- JWT ---
jwt.secret=${JWT_SECRET:DefaultSuperSecretKeyForTourPlanner2026!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Logging ---
logging.level.org.springframework=INFO
logging.level.tour_planner_lamthi_mehmeti=DEBUG
